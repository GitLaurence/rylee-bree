name: Update Storybook from Instagram

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install instaloader
        run: pip install instaloader

      - name: Fetch Instagram posts and update story
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: python scripts/fetch_and_update.py

      - name: Commit and push if story changed
        run: |
          git config user.name  "Instagram Story Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/story.js assets/photos/
          if git diff --staged --quiet; then
            echo "No new posts — nothing to commit."
          else
            git commit -m "Update story from @mariaaajoy Instagram [skip ci]"
            git push
          fi
