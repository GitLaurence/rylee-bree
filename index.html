<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8B44F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bedtime Stories">
  <title>Bedtime Stories — Rylee, Bree, Mary Joy & Astley</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='36' fill='%230a0118'/%3E%3Ccircle cx='96' cy='80' r='52' fill='%238B44F0'/%3E%3Ccircle cx='96' cy='80' r='44' fill='%23FFD700' opacity='.15'/%3E%3Ctext x='96' y='98' text-anchor='middle' font-size='54' font-family='serif'%3E%F0%9F%93%96%3C/text%3E%3Ccircle cx='52' cy='148' r='16' fill='%23FF3E9D'/%3E%3Ccircle cx='96' cy='160' r='16' fill='%238B44F0'/%3E%3Ccircle cx='140' cy='148' r='16' fill='%2300B4D8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- ── HOME SCREEN ─────────────────────────────────── -->
  <div id="home-screen">
    <header class="home-header">
      <div class="home-stars" aria-hidden="true" id="home-stars"></div>
      <h1 class="home-title">Bedtime Stories</h1>
      <p class="home-subtitle">with Rylee, Bree, Mary Joy &amp; Astley</p>
    </header>

    <div class="filter-bar" role="group" aria-label="Filter stories by character">
      <button class="filter-btn active" data-char="all" aria-pressed="true">⭐ All Stories</button>
      <button class="filter-btn" data-char="rylee" aria-pressed="false">🟣 Rylee</button>
      <button class="filter-btn" data-char="brielle" aria-pressed="false">🩷 Bree</button>
      <button class="filter-btn" data-char="mary-joy" aria-pressed="false">🌸 Mary Joy</button>
      <button class="filter-btn" data-char="astley" aria-pressed="false">💙 Astley</button>
      <button class="filter-btn" data-char="favorites" aria-pressed="false">❤️ Favourites</button>
    </div>

    <div class="reading-progress" id="reading-progress">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-label" id="progress-label">0 of 100 read</span>
    </div>

    <div class="story-count-bar">
      <span id="story-count-label">100 stories</span>
      <button class="random-btn" id="random-btn">🎲 Random Story</button>
      <button class="games-launch-btn" id="games-btn">🎮 Play Games</button>
    </div>

    <!-- Bedtime Timer bar -->
    <div class="timer-bar">
      <div id="timer-pill" class="timer-pill hidden" aria-live="polite"></div>
      <div class="timer-launch-wrap">
        <button class="timer-launch-btn" id="timer-btn" aria-haspopup="true" aria-label="Bedtime timer">⏰ Timer</button>
        <div class="timer-popover hidden" id="timer-popover" role="dialog" aria-label="Set bedtime timer">
          <p class="timer-popover-label">How long to read?</p>
          <div class="timer-presets">
            <button class="timer-preset" data-min="5">5 min</button>
            <button class="timer-preset" data-min="10">10 min</button>
            <button class="timer-preset" data-min="15">15 min</button>
            <button class="timer-preset" data-min="20">20 min</button>
          </div>
          <button class="timer-mute-btn" id="sfx-toggle" aria-label="Toggle sound effects">🔊 Sound On</button>
        </div>
      </div>
    </div>

    <div class="story-grid" id="story-grid" aria-live="polite"></div>
  </div>

  <!-- ── READER OVERLAY ──────────────────────────────── -->
  <div id="reader" class="reader hidden" role="dialog" aria-modal="true" aria-label="Story reader">
    <button class="reader-back" id="reader-back" aria-label="Back to stories">← Back</button>

    <div class="reader-layout">
      <!-- Book (illustration + mobile text panel) -->
      <div class="book-wrap">
        <div class="book" id="book">
          <div class="page" id="page"></div>
        </div>
        <div class="nav-bar">
          <button class="nav-btn" id="prev-btn" aria-label="Previous page">&#10094;</button>
          <div class="dots" id="dots"></div>
          <button class="nav-btn" id="next-btn" aria-label="Next page">&#10095;</button>
        </div>
      </div>

      <!-- Desktop text aside (hidden on mobile) -->
      <div class="story-aside" id="story-aside" aria-live="polite"></div>
    </div>
  </div>

  <!-- ── STORY VIDEO OVERLAY ───────────────────────── -->
  <div id="video-overlay" class="video-overlay hidden" role="dialog" aria-modal="true" aria-label="Story video">
    <div class="video-panel">
      <button class="video-close-btn" id="video-close" aria-label="Close video">✕</button>
      <h2 class="video-title" id="video-title"></h2>
      <video id="video-player" class="video-player" playsinline controls preload="none"></video>
    </div>
  </div>

  <!-- ── GAMES OVERLAY ─────────────────────────────── -->
  <div id="games-overlay" class="games-overlay hidden" role="dialog" aria-modal="true" aria-label="Mini games">
    <div class="games-panel">
      <button class="games-close-btn" id="games-close" aria-label="Close games">✕</button>
      <div id="games-content"></div>
    </div>
  </div>

  <!-- ── TIMER EXPIRED OVERLAY ─────────────────────── -->
  <div id="timer-expired-overlay" class="timer-expired-overlay hidden" role="alertdialog" aria-modal="true" aria-label="Bedtime reminder">
    <div class="timer-expired-panel">
      <div class="timer-expired-moon">🌙</div>
      <h2 class="timer-expired-title">Time for Sleep!</h2>
      <p class="timer-expired-msg">You read so many wonderful stories today. Sweet dreams, little ones!</p>
      <div class="timer-expired-stars" aria-hidden="true" id="timer-stars"></div>
      <button class="timer-expired-btn" id="timer-dismiss">Good Night 🌟</button>
    </div>
  </div>

  <script src="data/stories.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/storyVideo.js"></script>
  <script src="js/app.js"></script>
  <script src="js/games.js"></script>
  <script src="js/timer.js"></script>
  <script>
    // Register service worker for offline play
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
